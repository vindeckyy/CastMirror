name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-test:
    name: Ubuntu Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config protobuf-compiler libprotobuf-dev \
            libssl-dev libopus-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxfixes-dev \
            libva-dev libpipewire-0.3-dev libglib2.0-dev libavcodec-dev libswscale-dev libavutil-dev \
            nlohmann-json3-dev libgtest-dev libgtk-4-dev libadwaita-1-dev xvfb

      - name: Install GoogleTest (Ubuntu source package)
        run: |
          if [ -d /usr/src/googletest ]; then
            cmake -S /usr/src/googletest -B /tmp/gtest-build
            cmake --build /tmp/gtest-build -j"$(nproc)"
            sudo cmake --install /tmp/gtest-build
          fi

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCASTMIRROR_ENABLE_TRAY=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        working-directory: build
        run: xvfb-run -a ./tests/castmirror_tests
  build-test-asan:
    name: Ubuntu ASan / UBSan Debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config protobuf-compiler libprotobuf-dev \
            libssl-dev libopus-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxfixes-dev \
            libva-dev libpipewire-0.3-dev libglib2.0-dev libavcodec-dev libswscale-dev libavutil-dev \
            nlohmann-json3-dev libgtest-dev libgtk-4-dev libadwaita-1-dev xvfb

      - name: Install GoogleTest (Ubuntu source package)
        run: |
          if [ -d /usr/src/googletest ]; then
            cmake -S /usr/src/googletest -B /tmp/gtest-build
            cmake --build /tmp/gtest-build -j"$(nproc)"
            sudo cmake --install /tmp/gtest-build
          fi

      - name: Configure
        run: cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCASTMIRROR_ENABLE_TRAY=OFF -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: Test
        working-directory: build-asan
        run: ASAN_OPTIONS=detect_leaks=0 CASTMIRROR_FORCE_SOFTWARE_ENCODE=1 xvfb-run -a ./tests/castmirror_tests


