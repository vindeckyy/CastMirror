name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Every `uses:` below is pinned to a commit SHA; the trailing comment names the
# human-readable tag. Mutable tags let an upstream compromise rewrite the code
# that runs inside a release job holding `contents: write`.
#
# SHA provenance (`git ls-remote <repo> refs/tags/<tag>`):
#   actions/checkout            v4.2.2
#   actions/upload-artifact     v4.6.2
#   actions/download-artifact   v4.3.0
#   actions/setup-dotnet        v4.3.1
#   msys2/setup-msys2           v2.29.0
#   softprops/action-gh-release v2.2.2

jobs:
  build-deb:
    name: Build Debian/Ubuntu Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config protobuf-compiler libprotobuf-dev \
            libssl-dev libopus-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxfixes-dev \
            libxcomposite-dev libxdamage-dev \
            libva-dev libdrm-dev libpipewire-0.3-dev libglib2.0-dev libavcodec-dev libswscale-dev libavutil-dev \
            nlohmann-json3-dev libgtest-dev libgtk-4-dev libadwaita-1-dev xvfb \
            libayatana-appindicator-glib-dev \
            dpkg-dev rpm

      - name: Install GoogleTest (Ubuntu source package)
        run: |
          if [ -d /usr/src/googletest ]; then
            cmake -S /usr/src/googletest -B /tmp/gtest-build
            cmake --build /tmp/gtest-build -j"$(nproc)"
            sudo cmake --install /tmp/gtest-build
          fi

      # The tray is built ON so the released .deb matches what
      # docs/ARCHITECTURE.md advertises. CASTMIRROR_REQUIRE_TRAY makes a missing
      # Ayatana dev package a hard failure instead of a silently tray-less
      # artifact, which is how the tray dependency branch went dead before.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCASTMIRROR_ENABLE_TRAY=ON \
            -DCASTMIRROR_REQUIRE_TRAY=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        working-directory: build
        run: CASTMIRROR_FORCE_SOFTWARE_ENCODE=1 xvfb-run -a ctest --output-on-failure

      # The GPL/libx264 disclosure gate must run against the binaries that are
      # actually shipped, before cpack turns them into the release artifact.
      # ci.yml runs it too, but ci.yml never packages anything - see NOTICE:43-49.
      - name: License Surface & GPL Hygiene Check (pre-packaging)
        run: ./scripts/check_license_surface.sh

      - name: Package DEB
        working-directory: build
        run: cpack -G DEB

      # RPM is in CPACK_GENERATOR as well; rpmbuild on an Ubuntu runner is
      # best-effort, so a failure here does not block the .deb release.
      - name: Package RPM (best effort)
        working-directory: build
        continue-on-error: true
        run: cpack -G RPM

      - name: Generate SHA256SUMS next to the packages
        working-directory: build
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=( *.deb *.rpm )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "ERROR: cpack produced no packages" >&2
            exit 1
          fi
          sha256sum "${assets[@]}" | tee SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload packages and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages
          path: |
            build/*.deb
            build/*.rpm
            build/SHA256SUMS
          if-no-files-found: error

  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    env:
      SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A release must carry one version everywhere: the tag, CMakeLists.txt and the
      # WinUI project. Fail before spending time on a build that would be mislabelled.
      - name: Check the tag matches the version files
        shell: pwsh
        run: ./scripts/check_version.ps1 -Tag '${{ github.ref_name }}'

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-protobuf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-libx264

      - name: Configure native core (castcore.dll)
        shell: msys2 {0}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCASTMIRROR_BUILD_GUI=OFF
          -DCASTMIRROR_ENABLE_TRAY=OFF

      # package.ps1 only builds the castcore.dll target, so without this the
      # rest of the Windows tree (CLI, tests, tools) could be broken in a
      # release. Build everything and run the suite before packaging.
      - name: Build and test native tree
        shell: msys2 {0}
        run: |
          cmake --build build -j"$(nproc)"
          ./build/tests/castmirror_tests.exe

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # package.ps1 is the only supported Windows packaging entry point and is
      # invoked by no other workflow. It honours CASTMIRROR_MSYS2_BIN and
      # CASTMIRROR_DOTNET_ROOT.
      - name: Package Windows client (native castcore.dll + self-contained WinUI app)
        shell: pwsh
        run: |
          $env:CASTMIRROR_MSYS2_BIN = '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin'
          $env:CASTMIRROR_DOTNET_ROOT = Split-Path -Parent (Get-Command dotnet).Source
          Write-Host "CASTMIRROR_MSYS2_BIN=$env:CASTMIRROR_MSYS2_BIN"
          Write-Host "CASTMIRROR_DOTNET_ROOT=$env:CASTMIRROR_DOTNET_ROOT"
          ./package.ps1

      # Code signing is optional so forks and dry runs still build. Set the
      # SIGN_CERT_BASE64 (a .pfx, base64) and SIGN_CERT_PASSWORD repository secrets to
      # sign; without them the artifacts are unsigned and Windows SmartScreen warns.
      - name: Sign the application binaries
        if: env.SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1).FullName
          foreach ($file in 'publish\CastMirror.exe', 'publish\castcore.dll') {
            & $signtool sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $file
            if ($LASTEXITCODE -ne 0) { throw "signing $file failed" }
          }
          Remove-Item $pfx -Force

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & $iscc "installer\CastMirror.iss" "/DAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Sign the installer
        if: env.SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1).FullName
          Get-ChildItem dist -Filter 'CastMirror-Setup-*.exe' | ForEach-Object {
            & $signtool sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing $($_.Name) failed" }
          }
          Remove-Item $pfx -Force

      - name: Archive and checksum the Windows client
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'dist\CastMirror-win-x64.zip'
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $PWD 'publish\*') -DestinationPath $zip
          Push-Location dist
          $lines = Get-ChildItem CastMirror-* -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii SHA256SUMS-windows.txt
          Pop-Location
          Get-Content dist\SHA256SUMS-windows.txt

      - name: Upload Windows client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-client
          path: |
            dist/CastMirror-Setup-*.exe
            dist/CastMirror-win-x64.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  validate-flatpak:
    name: Validate Flatpak Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder

      - name: Reject un-pinned source entries
        run: |
          python3 - <<'PY'
          import json, sys
          path = "flatpak/io.github.vindeckyy.CastMirror.json"
          manifest = json.load(open(path, encoding="utf-8"))
          problems = []
          for module in manifest.get("modules", []):
              name = module.get("name", "<unnamed>")
              for source in module.get("sources", []):
                  kind = source.get("type")
                  if kind == "dir":
                      problems.append(f"{name}: 'dir' source is not release-shaped")
                  elif kind == "git" and not (source.get("commit") or source.get("tag")):
                      problems.append(f"{name}: git source has no commit/tag pin")
                  elif kind == "archive" and not source.get("sha256"):
                      problems.append(f"{name}: archive source has no sha256")
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("Flatpak source pins OK")
          PY

      - name: flatpak-builder --show-manifest
        run: flatpak-builder --show-manifest flatpak/io.github.vindeckyy.CastMirror.json

  publish:
    name: Publish GitHub Release
    needs: [build-deb, build-windows]
    runs-on: ubuntu-latest
    # Approval gate: create a `release` environment in the repository settings
    # and add required reviewers. Nothing below runs until a human approves.
    environment:
      name: release
      url: https://github.com/vindeckyy/CastMirror/releases
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums before publishing
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS-windows.txt
          ls -l

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
            dist/SHA256SUMS-windows.txt
            dist/CastMirror-Setup-*.exe
            dist/CastMirror-win-x64.zip
          # A release missing any of these is a broken release; do not publish part of it.
          fail_on_unmatched_files: true
          generate_release_notes: true
