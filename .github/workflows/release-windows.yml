name: Release (Windows)

# Windows and Linux ship as separate releases with their own tags:
#   windows-v1.0.0  ->  this workflow
#   linux-v1.0.0    ->  release-linux.yml
on:
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: write

# Every `uses:` below is pinned to a commit SHA; the trailing comment names the
# human-readable tag. Mutable tags let an upstream compromise rewrite the code
# that runs inside a release job holding `contents: write`.
#
# SHA provenance (`git ls-remote <repo> refs/tags/<tag>`):
#   actions/checkout            v4.2.2
#   actions/upload-artifact     v4.6.2
#   actions/download-artifact   v4.3.0
#   actions/setup-dotnet        v4.3.1
#   msys2/setup-msys2           v2.29.0
#   softprops/action-gh-release v2.2.2

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    env:
      SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A release must carry one version everywhere: the tag, CMakeLists.txt and the
      # WinUI project. Fail before spending time on a build that would be mislabelled.
      - name: Check the tag matches the version files
        shell: pwsh
        run: ./scripts/check_version.ps1 -Tag '${{ github.ref_name }}'

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-protobuf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-libx264

      - name: Configure native core (castcore.dll)
        shell: msys2 {0}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCASTMIRROR_BUILD_GUI=OFF
          -DCASTMIRROR_ENABLE_TRAY=OFF

      # package.ps1 only builds the castcore.dll target, so without this the
      # rest of the Windows tree (CLI, tests, tools) could be broken in a
      # release. Build everything and run the suite before packaging.
      - name: Build and test native tree
        shell: msys2 {0}
        run: |
          cmake --build build -j"$(nproc)"
          ./build/tests/castmirror_tests.exe

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # package.ps1 is the only supported Windows packaging entry point and is
      # invoked by no other workflow. It honours CASTMIRROR_MSYS2_BIN and
      # CASTMIRROR_DOTNET_ROOT.
      - name: Package Windows client (native castcore.dll + self-contained WinUI app)
        shell: pwsh
        run: |
          $env:CASTMIRROR_MSYS2_BIN = '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin'
          $env:CASTMIRROR_DOTNET_ROOT = Split-Path -Parent (Get-Command dotnet).Source
          Write-Host "CASTMIRROR_MSYS2_BIN=$env:CASTMIRROR_MSYS2_BIN"
          Write-Host "CASTMIRROR_DOTNET_ROOT=$env:CASTMIRROR_DOTNET_ROOT"
          ./package.ps1

      # Code signing is optional so forks and dry runs still build. Set the
      # SIGN_CERT_BASE64 (a .pfx, base64) and SIGN_CERT_PASSWORD repository secrets to
      # sign; without them the artifacts are unsigned and Windows SmartScreen warns.
      - name: Sign the application binaries
        if: env.SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1).FullName
          foreach ($file in 'publish\CastMirror.exe', 'publish\castcore.dll') {
            & $signtool sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $file
            if ($LASTEXITCODE -ne 0) { throw "signing $file failed" }
          }
          Remove-Item $pfx -Force

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = '${{ github.ref_name }}' -replace '^windows-v', ''
          & $iscc "installer\CastMirror.iss" "/DAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Sign the installer
        if: env.SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1).FullName
          Get-ChildItem dist -Filter 'CastMirror-Setup-*.exe' | ForEach-Object {
            & $signtool sign /f $pfx /p $env:SIGN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing $($_.Name) failed" }
          }
          Remove-Item $pfx -Force

      - name: Archive and checksum the Windows client
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'dist\CastMirror-win-x64.zip'
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $PWD 'publish\*') -DestinationPath $zip
          Push-Location dist
          $lines = Get-ChildItem CastMirror-* -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii SHA256SUMS-windows.txt
          Pop-Location
          Get-Content dist\SHA256SUMS-windows.txt

      - name: Upload Windows client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-client
          path: |
            dist/CastMirror-Setup-*.exe
            dist/CastMirror-win-x64.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/vindeckyy/CastMirror/releases
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums before publishing
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS-windows.txt
          ls -l

      - name: Pick the release notes for this tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#windows-v}"
          notes="docs/release-notes/windows-${version}.md"
          test -f "$notes" || { echo "missing $notes" >&2; exit 1; }
          echo "NOTES=$notes" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: CastMirror ${{ env.VERSION }} for Windows
          body_path: ${{ env.NOTES }}
          files: |
            dist/SHA256SUMS-windows.txt
            dist/CastMirror-Setup-*.exe
            dist/CastMirror-win-x64.zip
          # A release missing any of these is a broken release; do not publish part of it.
          fail_on_unmatched_files: true
          # The README's "latest release" link is the Windows download.
          make_latest: true