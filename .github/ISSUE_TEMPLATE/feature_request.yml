name: Feature request
description: Propose a user-visible or protocol improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: What is painful or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: Concrete behavior. Keep it scoped.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Linux GTK GUI
        - CLI
        - Capture / encode
        - Cast protocol / transport
        - Windows (blueprint)
        - Docs / site
        - Other
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Non-goals for v1 include cloud relay, multi-room groups, tab/file fling,
        remote input to the TV, HDR tone-mapping, and DRM playback.
